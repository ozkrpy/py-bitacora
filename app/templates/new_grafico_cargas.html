{% extends "new_base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card border-0 shadow-sm rounded-4">
                
                <div class="card-header bg-white border-bottom-0 pt-4 pb-2">
                    <h4 class="fw-bold text-dark mb-0">
                        <i class="bi bi-graph-up-arrow text-primary me-2"></i>Tendencia de Consumo (L/100Km)
                    </h4>
                    <p class="text-muted small mb-0">Rendimiento histórico de tu vehículo entre recargas.</p>
                </div>

                <div class="card-body position-relative d-flex justify-content-center">
                    
                    <div id="loadingLineChart" class="position-absolute top-50 start-50 translate-middle" style="z-index: 10;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Procesando datos...</span>
                        </div>
                    </div>
                    
                    <div style="position: relative; height: 400px; width: 100%;">
                        <canvas id="tendenciaCargasChart"></canvas>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
$(document).ready(function() {
    // Solicitar datos al backend al cargar la página
    $.ajax({
        url: '/api/reporte/grafica-cargas',
        method: 'GET',
        dataType: 'json',
        success: function(response) {
            $('#loadingLineChart').fadeOut(200);
            
            if (response.success && response.fechas.length > 0) {
                renderizarGraficoLineas(response.fechas, response.consumos, response.emblemas);
            } else {
                $('#tendenciaCargasChart').parent().html(`
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-cone-striped display-4 d-block mb-3 opacity-50"></i>
                        <p>No hay suficientes datos de kilometraje para calcular una tendencia.</p>
                    </div>
                `);
            }
        },
        error: function() {
            $('#loadingLineChart').fadeOut(200);
            alert("Error de conexión al cargar la gráfica de consumo.");
        }
    });
});

function renderizarGraficoLineas(labels, data, emblemas) {
    const ctx = document.getElementById('tendenciaCargasChart').getContext('2d');

    // Crear un gradiente sutil debajo de la línea para el estilo "Soft-UI"
    let gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, 'rgba(13, 110, 253, 0.2)'); // Azul primario translúcido
    gradient.addColorStop(1, 'rgba(13, 110, 253, 0)');   // Transparente al fondo

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Consumo (L/100Km)',
                data: data,
                borderColor: '#0d6efd', // Color azul Bootstrap principal
                backgroundColor: gradient,
                borderWidth: 3,
                pointBackgroundColor: '#ffffff',
                pointBorderColor: '#0d6efd',
                pointBorderWidth: 2,
                pointRadius: 4,
                pointHoverRadius: 6,
                fill: true,
                tension: 0.4 // Curvatura de la línea (0 = recta, >0 = curva)
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                intersect: false,
                mode: 'index',
            },
            scales: {
                y: {
                    beginAtZero: false,
                    title: {
                        display: true,
                        text: 'Litros cada 100 Km',
                        font: { family: "system-ui", weight: 'bold' }
                    },
                    grid: {
                        color: 'rgba(0, 0, 0, 0.05)',
                        borderDash: [5, 5] // Líneas punteadas horizontales
                    }
                },
                x: {
                    grid: { display: false } // Ocultar líneas verticales para mayor limpieza
                }
            },
            plugins: {
                legend: { display: false }, // Ocultamos la leyenda superior porque solo hay 1 línea
                tooltip: {
                    backgroundColor: 'rgba(33, 37, 41, 0.95)',
                    padding: 12,
                    titleFont: { size: 14, family: 'system-ui' },
                    bodyFont: { size: 13, family: 'system-ui' },
                    callbacks: {
                        // Personalizamos el Tooltip para inyectar el emblema de la estación
                        afterTitle: function(context) {
                            const index = context[0].dataIndex;
                            return `Estación: ${emblemas[index]}`;
                        },
                        label: function(context) {
                            return ` Rendimiento: ${context.raw} Lts/100Km`;
                        }
                    }
                }
            }
        }
    });
}
</script>
{% endblock %}
